[mod-name]
hydrogen-bomb=Wasserstoffbombe

[mod-description]
hydrogen-bomb=Fügt Space Age eine Wasserstoffbombe hinzu, die im späten Spielverlauf freigeschaltet wird, einen wesentlich größeren Explosionsradius besitzt und wesentlich mehr Schaden verursacht als die Atombombe. Qualität wird empfohlen; andernfalls reicht die Reichweite der Vanilla-Waffen nicht aus, um die Wasserstoffbombe sicher abzufeuern.

[item-name]
hydrogen-bomb=Wasserstoffbombe

[item-description]
hydrogen-bomb=[img=utility/warning_icon] Von den Vanilla-Abschussplattformen können nur solche von [font=default-bold]legendärer Qualität[/font] diese Rakete von außerhalb ihres Explosionsradius abfeuern. Dazu gehören:\n[item=rocket-launcher,quality=legendary] [item=spidertron,quality=legendary] [item=rocket-turret,quality=legendary]
hydrogen-bomb-no-quality=[img=utility/warning_icon] Keine Vanilla-Abschussplattform kann diese Rakete von außerhalb ihres Explosionsradius abfeuern. Dazu gehören:\n[item=rocket-launcher] [item=spidertron] [item=rocket-turret]\nEs wird empfohlen, [font=default-bold]Qualität[/font] zu aktivieren, um die für einen sicheren Abschuss erforderliche Reichweite zu erreichen.

