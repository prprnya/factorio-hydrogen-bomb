[mod-name]
hydrogen-bomb=Водородная бомба

[mod-description]
hydrogen-bomb=Добавляет в Space Age водородную бомбу, которая открывается на позднем этапе игры. Радиус её взрыва значительно больше, а наносимый урон значительно выше, чем у атомной бомбы. Рекомендуется включить Качество; иначе дальности ванильного оружия недостаточно для безопасного запуска водородной бомбы.

[item-name]
hydrogen-bomb=Водородная бомба

[item-description]
hydrogen-bomb=[img=utility/warning_icon] Среди ванильных средств запуска только средства [font=default-bold]легендарного качества[/font] могут запустить эту ракету из-за пределов радиуса её взрыва. К ним относятся:\n[item=rocket-launcher,quality=legendary] [item=spidertron,quality=legendary] [item=rocket-turret,quality=legendary]
hydrogen-bomb-no-quality=[img=utility/warning_icon] Ни одно ванильное средство запуска не может запустить эту ракету из-за пределов радиуса её взрыва. К ним относятся:\n[item=rocket-launcher] [item=spidertron] [item=rocket-turret]\nРекомендуется включить [font=default-bold]Качество[/font], чтобы получить дальность, необходимую для безопасного запуска.

