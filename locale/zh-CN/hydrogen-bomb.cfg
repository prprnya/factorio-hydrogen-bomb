[mod-name]
hydrogen-bomb=氢弹

[mod-description]
hydrogen-bomb=为“太空时代”添加一种在游戏后期解锁的氢弹，其爆炸半径和伤害均远超原子弹。推荐启用“品质等级”，否则原版武器的射程不足以安全发射它。

[item-name]
hydrogen-bomb=氢弹

[item-description]
hydrogen-bomb=[img=utility/warning_icon] 原版发射平台只有达到[font=default-bold]传说品质[/font]，才能在这枚火箭弹的爆炸半径之外发射它，包括：\n[item=rocket-launcher,quality=legendary] [item=spidertron,quality=legendary] [item=rocket-turret,quality=legendary]
hydrogen-bomb-no-quality=[img=utility/warning_icon] 原版发射平台均无法在这枚火箭弹的爆炸半径之外发射它，包括：\n[item=rocket-launcher] [item=spidertron] [item=rocket-turret]\n推荐启用[font=default-bold]品质等级[/font]，以获得安全发射所需的射程。

