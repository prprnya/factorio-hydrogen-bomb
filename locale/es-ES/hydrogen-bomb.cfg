[mod-name]
hydrogen-bomb=Bomba de hidrógeno

[mod-description]
hydrogen-bomb=Añade a Space Age una bomba de hidrógeno que se desbloquea en las fases avanzadas de la partida, con un radio de explosión mucho mayor y mucho más daño que la bomba atómica. Se recomienda activar Calidad; de lo contrario, las armas vanilla no tienen alcance suficiente para lanzarla con seguridad.

[item-name]
hydrogen-bomb=Bomba de hidrógeno

[item-description]
hydrogen-bomb=[img=utility/warning_icon] Entre las plataformas de lanzamiento del juego vainilla, solo las de [font=default-bold]calidad legendaria[/font] pueden lanzar este cohete desde fuera de su radio de explosión. Entre ellas se incluyen:\n[item=rocket-launcher,quality=legendary] [item=spidertron,quality=legendary] [item=rocket-turret,quality=legendary]
hydrogen-bomb-no-quality=[img=utility/warning_icon] Ninguna plataforma de lanzamiento del juego vainilla puede lanzar este cohete desde fuera de su radio de explosión. Entre ellas se incluyen:\n[item=rocket-launcher] [item=spidertron] [item=rocket-turret]\nSe recomienda activar [font=default-bold]Calidad[/font] para obtener el alcance necesario para lanzarlo con seguridad.

